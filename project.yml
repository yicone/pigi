name: Pigi
options:
  bundleIdPrefix: one.yic
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pigi:
    type: application
    platform: macOS
    sources:
      - Pigi
    preBuildScripts:
      - name: Build universal Proton helper
        script: bash "$SRCROOT/tools/build-proton-helper.sh" "$DERIVED_FILE_DIR/proton-helper"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    postBuildScripts:
      - name: Embed and sign Proton helper
        script: |
          set -euo pipefail
          HELPER="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/pigi-proton-helper"
          mkdir -p "$(dirname "$HELPER")"
          cp "$DERIVED_FILE_DIR/proton-helper/pigi-proton-helper" "$HELPER"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$IDENTITY" = "-" ]; then
            codesign --force --sign - --options runtime "$HELPER"
          else
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$HELPER"
          fi
          codesign --verify --strict "$HELPER"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.yic.pigi
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: pigi
        PRODUCT_MODULE_NAME: Pigi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: pigi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Pigi/Pigi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
